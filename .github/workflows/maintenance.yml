name: Scheduled maintenance report
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run maintenance checks
        run: |
          mkdir -p reports
          {
            echo "# Maintenance report"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            python scripts/validate_products.py
            python scripts/audit_seo.py
            python scripts/check_links.py
            python -m unittest discover -s tests
          } | tee reports/maintenance.txt
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: reports/maintenance.txt
          retention-days: 14
