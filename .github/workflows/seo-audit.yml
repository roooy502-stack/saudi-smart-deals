name: SEO audit
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '11 5 * * 1'
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_seo.py
